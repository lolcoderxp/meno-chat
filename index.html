<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus AI - Fixed Header & Smooth Dynamic Bar</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      background-color: #000000;
      display: flex;
      flex-direction: column;
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* --- هدر بالا (کاملاً ثابت و نمی‌رود بالا) --- */
    .top-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: transparent;
      z-index: 100;
      direction: rtl;
      width: 100%;
      position: relative;
      /* مهم: هدر هرگز کوچک یا جابجا نمی‌شود */
      min-height: 72px;
    }

    .header-left-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-right-group {
      display: flex;
      align-items: center;
    }

    .header-circle-btn {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(145deg, #18181b 0%, #0d0d0f 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 1px solid rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.7), 
                  0 4px 12px -2px rgba(0, 0, 0, 0.5), 
                  inset 0 1px 2px rgba(255, 255, 255, 0.2);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }

    .header-circle-btn:active {
      transform: scale(0.93);
    }

    .header-pill-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: linear-gradient(145deg, #18181b 0%, #0d0d0f 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 30px;
      cursor: pointer;
      color: #bfa1ff;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: 0 10px 25px -3px rgba(0, 0, 0, 0.7), 
                  0 4px 12px -2px rgba(0, 0, 0, 0.5), 
                  inset 0 1px 2px rgba(255, 255, 255, 0.2);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .header-pill-btn:active {
      transform: scale(0.95);
    }

    /* --- ناحیه نمایش پیام‌ها (با padding مناسب) --- */
    .chat-stream {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 8px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
      direction: rtl;
      min-height: 0;
      /* مهم: این بخش کش می‌آید و فضای باقیمانده را پر می‌کند */
    }

    .chat-stream::-webkit-scrollbar {
      width: 3px;
    }

    .chat-stream::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .message-row {
      display: flex;
      width: 100%;
      animation: fadeInMessage 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInMessage {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.ai {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 85%;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
      text-align: right;
    }

    .message-row.user .message-bubble {
      background: #111113;
      color: #ffffff;
      border-radius: 20px 20px 4px 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .message-row.ai .message-bubble {
      background: transparent;
      color: #e5e5ea;
      border-radius: 20px 20px 20px 4px;
      padding-right: 0;
    }

    /* --- پنل پایین (کاملاً در پایین و ثابت) --- */
    .footer-container {
      flex-shrink: 0;
      padding: 8px 16px 22px 16px;
      background: #000000;
      z-index: 100;
      direction: rtl;
      display: flex;
      justify-content: center;
      width: 100%;
      /* مهم: فوتر هرگز کوچک یا جابجا نمی‌شود */
      min-height: 76px;
    }

    .chat-input-bar {
      position: relative;
      display: flex;
      align-items: center;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 36px;
      padding: 6px 12px;
      width: 90%;
      max-width: 400px;
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1), 
                  max-width 0.6s cubic-bezier(0.25, 1, 0.5, 1), 
                  box-shadow 0.5s ease;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 
                  0 10px 30px rgba(0, 0, 0, 0.6), 
                  inset 0 1px 3px rgba(255, 255, 255, 0.18);
    }

    /* وقتی input فوکوس می‌شه، کادر کاملاً بزرگ می‌شه ولی هدر و فوتر ثابت می‌مونن */
    body.keyboard-active .chat-input-bar {
      width: 100% !important;
      max-width: 100% !important;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 1), 
                  0 15px 35px rgba(0, 0, 0, 0.8), 
                  inset 0 1px 3px rgba(255, 255, 255, 0.22);
    }

    .chat-input-bar::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 36px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .bar-right-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      z-index: 2;
    }

    .custom-voice-btn {
      position: relative;
      background: transparent;
      border: none;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      padding: 0;
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }

    .custom-voice-btn svg {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
    }

    .bar-action-btn {
      position: relative;
      background: linear-gradient(145deg, #18181b 0%, #0d0d0f 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #98989f;
      border-radius: 50%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.18);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }

    .bar-action-btn:active, .custom-voice-btn:active {
      transform: scale(0.92);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 14.5px;
      line-height: 38px;
      height: 38px;
      padding: 0 10px;
      direction: rtl;
      z-index: 2;
      min-width: 0;
      width: 100%;
      text-align: right;
    }

    .chat-input::placeholder {
      color: #727278;
    }

    /* برای موبایل‌های خیلی کوچک */
    @media (max-width: 380px) {
      .header-pill-btn {
        padding: 8px 12px;
        font-size: 12px;
      }
      .header-circle-btn {
        width: 38px;
        height: 38px;
      }
      .header-circle-btn svg {
        width: 18px;
        height: 18px;
      }
      .chat-input-bar {
        padding: 4px 10px;
      }
      .bar-action-btn {
        width: 34px;
        height: 34px;
      }
      .bar-action-btn svg {
        width: 16px;
        height: 16px;
      }
      .custom-voice-btn {
        width: 36px;
        height: 36px;
      }
      .custom-voice-btn svg {
        width: 36px;
        height: 36px;
      }
    }

    /* برای جلوگیری از جابجایی هدر در موبایل هنگام باز شدن کیبورد */
    @supports (-webkit-touch-callout: none) {
      body {
        /* برای iOS */
        height: -webkit-fill-available;
      }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <header class="top-header" id="topHeader">
    <div class="header-left-group">
      <button class="header-circle-btn" title="منو">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 22px; height: 22px;">
          <path d="M4 7L7 7M20 7L11 7" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"></path>
          <path d="M20 17H17M4 17L13 17" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"></path>
          <path d="M4 12H7L20 12" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
      </button>

      <button class="header-pill-btn" title="دریافت پلاس">
        <span>دریافت پلاس</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z"></path>
        </svg>
      </button>
    </div>

    <div class="header-right-group">
      <button class="header-circle-btn" title="چت جدید">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 22px; height: 22px;">
          <path d="M8 10.5H16" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"></path>
          <path d="M8 14H13.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"></path>
          <path d="M17 3.33782C15.5291 2.48697 13.8214 2 12 2C6.47715 2 2 6.47715 2 12C2 13.5997 2.37562 15.1116 3.04346 16.4525C3.22094 16.8088 3.28001 17.2161 3.17712 17.6006L2.58151 19.8267C2.32295 20.793 3.20701 21.677 4.17335 21.4185L6.39939 20.8229C6.78393 20.72 7.19121 20.7791 7.54753 20.9565C8.88837 21.6244 10.4003 22 12 22C17.5228 22 22 17.5228 22 12C22 10.1786 21.513 8.47087 20.6622 7" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
      </button>
    </div>
  </header>

  <div class="chat-stream" id="chatStream">
    <div class="message-row ai">
      <div class="message-bubble">
        سلام! 👋 من دستیار هوش مصنوعی شما هستم. چطور می‌توانم کمک کنم؟
      </div>
    </div>
  </div>

  <div class="footer-container">
    <div class="chat-input-bar" id="inputBar">
      <button class="bar-action-btn" title="افزودن">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <input type="text" class="chat-input" id="chatInput" placeholder="از ChatGPT بپرس..." autocomplete="off">

      <div class="bar-right-controls">
        <button class="bar-action-btn" title="میکروفون">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <button class="custom-voice-btn" title="حالت صوتی">
          <svg width="40" height="40" viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
            <circle cx="34" cy="34" r="34" fill="#3B82F6"/>
            <g fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round">
              <path d="M18.5 30.5V37.5"/>
              <path d="M25.5 24V44"/>
              <path d="M32.5 28V40"/>
              <path d="M39.5 21V47"/>
              <path d="M46.5 29V39"/>
            </g>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const chatInput = document.getElementById('chatInput');
    const bodyElement = document.body;
    const chatStream = document.getElementById('chatStream');

    // مدیریت فوکوس برای بزرگ شدن کادر (هدر و فوتر ثابت می‌مونن)
    chatInput.addEventListener('focus', function() {
      bodyElement.classList.add('keyboard-active');
      // اسکرول به پایین بعد از باز شدن کیبورد
      setTimeout(() => {
        chatStream.scrollTop = chatStream.scrollHeight;
      }, 350);
    });

    chatInput.addEventListener('blur', function() {
      setTimeout(() => {
        if (document.activeElement !== chatInput) {
          bodyElement.classList.remove('keyboard-active');
        }
      }, 100);
    });

    // ارسال پیام با Enter
    chatInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && this.value.trim()) {
        const userMessage = this.value.trim();
        addMessage(userMessage, 'user');
        this.value = '';
        
        // پاسخ خودکار (نمایشی)
        setTimeout(() => {
          addMessage('در حال پردازش... 🤔', 'ai');
          setTimeout(() => {
            const lastMsg = chatStream.lastElementChild;
            if (lastMsg) {
              lastMsg.querySelector('.message-bubble').textContent = 'متوجه شدم! سوال شما: "' + userMessage + '"';
            }
          }, 500);
        }, 300);
        
        // اسکرول به پایین
        setTimeout(() => {
          chatStream.scrollTop = chatStream.scrollHeight;
        }, 100);
      }
    });

    // تابع اضافه کردن پیام
    function addMessage(text, type) {
      const messageRow = document.createElement('div');
      messageRow.className = 'message-row ' + type;
      
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = text;
      
      messageRow.appendChild(bubble);
      chatStream.appendChild(messageRow);
      
      // اسکرول به پایین
      chatStream.scrollTop = chatStream.scrollHeight;
    }
  </script>

</body>
</html>
