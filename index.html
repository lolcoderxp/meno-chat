<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Nexus AI - Fixed Header Mobile Layout</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    html, body { background: #000; width: 100%; height: 100%; height: 100dvh; overflow: hidden !important; overscroll-behavior: none; position: fixed; inset: 0; }
    body { margin: 0; touch-action: pan-y; }
    button { -webkit-appearance: none; appearance: none; touch-action: manipulation; }

    .top-header { position: fixed; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: #000; z-index: 1000; direction: ltr; transform: translate3d(0, 0, 0); }
    .header-left-group { display: flex; align-items: center; }
    .header-right-group { display: flex; align-items: center; gap: 6px; flex-direction: row-reverse; }
    .header-circle-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(145deg, #18181b 0%, #0d0d0f 100%); border: 1px solid rgba(255,255,255,.12); border-top: 1px solid rgba(255,255,255,.28); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; box-shadow: 0 6px 16px rgba(0,0,0,.7), inset 0 1px 2px rgba(255,255,255,.18); transition: transform .2s ease; outline: none; }
    .header-circle-btn:active { transform: scale(.92); }
    .header-circle-btn:focus, .header-pill-btn:focus { outline: none; }
    .header-pill-btn { position: relative; display: flex; align-items: center; gap: 5px; height: 36px; padding: 0 12px; background: linear-gradient(145deg,#18181b 0%,#0d0d0f 100%); border: 1px solid rgba(255,255,255,.12); border-top: 1px solid rgba(255,255,255,.28); border-radius: 18px; cursor: pointer; color: #bfa1ff; font-size: 12.5px; font-weight: 500; box-shadow: 0 6px 16px rgba(0,0,0,.7), inset 0 1px 2px rgba(255,255,255,.18); transition: transform .2s ease; outline: none; }
    .header-pill-btn:active { transform: scale(.95); }

    .chat-stream { position: absolute; top: 52px; bottom: 65px; left: 0; right: 0; overflow-y: auto; overflow-x: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; overscroll-behavior: contain; direction: ltr; -webkit-overflow-scrolling: touch; }
    .chat-stream::-webkit-scrollbar { width: 3px; }
    .chat-stream::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
    .message-row { display: flex; width: 100%; animation: fadeInMessage .35s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes fadeInMessage { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .message-row.user { justify-content: flex-end; }
    .message-row.ai { justify-content: flex-start; }
    .message-bubble { max-width: 85%; padding: 12px 16px; font-size: 14px; line-height: 1.6; word-break: break-word; text-align: left; }
    .message-row.user .message-bubble { background: #111113; color: #fff; border-radius: 20px 20px 20px 4px; border: 1px solid rgba(255,255,255,.1); }
    .message-row.ai .message-bubble { background: transparent; color: #e5e5ea; border-radius: 20px 20px 4px 20px; padding-left: 0; }

    .footer-container { position: fixed; bottom: 0; left: 0; right: 0; padding: 8px 14px 14px; background: #000; z-index: 1000; direction: ltr; display: flex; justify-content: center; transform: translate3d(0,0,0); }
    .chat-input-bar { position: relative; display: flex; align-items: center; background: #000; border: 1px solid rgba(255,255,255,.16); border-top: 1px solid rgba(255,255,255,.3); border-radius: 36px; padding: 6px 12px; width: 88%; max-width: 350px; transition: width .4s cubic-bezier(.25,1,.5,1), max-width .4s cubic-bezier(.25,1,.5,1); box-shadow: 0 20px 50px rgba(0,0,0,.9), 0 8px 25px rgba(0,0,0,.6), inset 0 1px 3px rgba(255,255,255,.18); }
    body.keyboard-active .chat-input-bar { width: 100%; max-width: 100%; }
    .chat-input-bar::before { content: ''; position: absolute; inset: -1px; border-radius: 36px; background: linear-gradient(180deg,rgba(255,255,255,.08) 0%,transparent 60%); pointer-events: none; }
    .bar-right-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; z-index: 2; }
    .custom-voice-btn { position: relative; background: transparent; border: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; padding: 0; }
    .custom-voice-btn svg { width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 6px 18px rgba(59,130,246,.5); }
    .bar-action-btn { position: relative; background: linear-gradient(145deg,#18181b 0%,#0d0d0f 100%); border: 1px solid rgba(255,255,255,.12); border-top: 1px solid rgba(255,255,255,.25); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #98989f; border-radius: 50%; box-shadow: 0 6px 16px rgba(0,0,0,.7), inset 0 1px 2px rgba(255,255,255,.18); flex-shrink: 0; outline: none; }
    .chat-input { flex-grow: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 14px; line-height: 36px; height: 36px; padding: 0 8px; direction: ltr; z-index: 2; -webkit-user-select: text; user-select: text; }
    .chat-input::placeholder { color: #727278; }
  </style>
</head>
<body oncontextmenu="return false;">
  <header class="top-header" id="topHeader">
    <div class="header-left-group">
      <button class="header-circle-btn" type="button" tabindex="-1" title="New Chat" aria-label="New Chat">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px"><path d="M8 10.5H16" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M8 14H13.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M17 3.33782C15.5291 2.48697 13.8214 2 12 2C6.47715 2 2 6.47715 2 12C2 13.5997 2.37562 15.1116 3.04346 16.4525C3.22094 16.8088 3.28001 17.2161 3.17712 17.6006L2.58151 19.8267C2.32295 20.793 3.20701 21.677 4.17335 21.4185L6.39939 20.8229C6.78393 20.72 7.19121 20.7791 7.54753 20.9565C8.88837 21.6244 10.4003 22 12 22C17.5228 22 22 17.5228 22 12C22 10.1786 21.513 8.47087 20.6622 7" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="header-right-group">
      <button class="header-circle-btn" type="button" tabindex="-1" title="Menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px"><path d="M4 7L7 7M20 7L11 7" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M20 17H17M4 17L13 17" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M4 12H7L20 12" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="header-pill-btn" type="button" tabindex="-1" title="Get Plus" aria-label="Get Plus"><span>Get Plus</span><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8L12 2z"/></svg></button>
    </div>
  </header>

  <div class="chat-stream" id="chatStream">
    <div class="message-row ai"><div class="message-bubble">مشکل بالا رفتن صفحه با باز شدن کیبورد کاملاً برطرف شد. اکنون هدر بالا در جای خود قفل است و با لمس کادر چت جابه‌جا نمی‌شود.</div></div>
  </div>

  <div class="footer-container">
    <div class="chat-input-bar" id="inputBar">
      <button class="bar-action-btn" type="button" title="Add" aria-label="Add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <input type="text" class="chat-input" id="chatInput" placeholder="Ask ChatGPT" autocomplete="off">
      <div class="bar-right-controls">
        <button class="bar-action-btn" type="button" title="Microphone" aria-label="Microphone"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
        <button class="custom-voice-btn" type="button" title="Voice Mode" aria-label="Voice Mode"><svg width="36" height="36" viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg"><circle cx="34" cy="34" r="34" fill="#3B82F6"/><g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M18.5 30.5V37.5"/><path d="M25.5 24V44"/><path d="M32.5 28V40"/><path d="M39.5 21V47"/><path d="M46.5 29V39"/></g></svg></button>
      </div>
    </div>
  </div>

  <script>
    const chatInput = document.getElementById('chatInput');
    const bodyElement = document.body;
    const topHeader = document.getElementById('topHeader');
    let savedScrollY = 0;

    function lockPagePosition() {
      savedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
      window.scrollTo(0, 0);
    }

    // On Android/Samsung browsers, tapping a button can temporarily focus it and
    // trigger an unwanted visual-viewport pan. Keep header controls unfocusable.
    document.querySelectorAll('.top-header button').forEach((button) => {
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        lockPagePosition();
        button.blur();
      }, { passive: false });

      button.addEventListener('touchstart', (event) => {
        event.preventDefault();
        lockPagePosition();
        button.blur();
      }, { passive: false });
    });

    chatInput.addEventListener('focus', () => bodyElement.classList.add('keyboard-active'));
    chatInput.addEventListener('blur', () => {
      setTimeout(() => {
        if (document.activeElement !== chatInput) bodyElement.classList.remove('keyboard-active');
        lockPagePosition();
      }, 200);
    });

    // Stop browser-level page scrolling; only the chat stream should scroll.
    window.addEventListener('scroll', () => {
      if ((window.scrollY || document.documentElement.scrollTop) !== 0) window.scrollTo(0, 0);
    }, { passive: true });

    if (window.visualViewport) {
      visualViewport.addEventListener('scroll', lockPagePosition, { passive: true });
    }

    topHeader.addEventListener('click', () => {
      requestAnimationFrame(lockPagePosition);
    }, { passive: true });
  </script>
</body>
</html>
